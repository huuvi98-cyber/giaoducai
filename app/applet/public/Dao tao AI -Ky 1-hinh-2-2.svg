    <circle cx="50" cy="50" r="26" fill="#6366f1"/>
    <text x="50" y="58" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">5</text>
